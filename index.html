
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#166534">
  <meta name="description" content="Kos surabaya-kost murah surabaya-kost suami istri/single">
  <title>KOST MURAH SURABAYA BAFAN KOST DAN GRIYA PERMAI ASEMJAJAR SURABAYA</title>

  <style>
    :root {
      --green: #166534;
      --dark: #14251b;
      --bg: #f5f7f4;
      --white: #fff;
      --muted: #69756c;
      --border: #e3e9e3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: var(--dark);
      background: var(--bg);
      line-height: 1.65;
    }

    a { color: inherit; text-decoration: none; }

    header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav {
      max-width: 1120px;
      margin: auto;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      color: var(--green);
      font-size: 21px;
      font-weight: 800;
    }

    .nav a.button {
      background: var(--green);
      color: white;
      padding: 9px 15px;
      border-radius: 9px;
      font-size: 14px;
    }

    .hero {
      background: linear-gradient(135deg, #14532d, #27834a);
      color: white;
      padding: 55px 20px;
    }

    .hero-inner {
      max-width: 1120px;
      margin: auto;
    }

    .hero h1 {
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.15;
      margin: 0 0 14px;
    }

    .hero p {
      max-width: 620px;
      color: #e0f2e5;
      margin: 0;
    }

    main {
      max-width: 1120px;
      padding: 32px 20px 60px;
      margin: auto;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .section-heading h2 { margin: 0; font-size: 25px; }

    .search {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 24px;
      outline-color: var(--green);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .post {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 15px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform .2s, box-shadow .2s;
    }

    .post:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px #102b1712;
    }

    .post img {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      background: #e8eee8;
      display: block;
    }

    .post-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      flex: 1;
    }

    .post h3 {
      margin: 0 0 10px;
      font-size: 19px;
      line-height: 1.4;
    }

    .post p {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 18px;
    }

    .read-more {
      margin-top: auto;
      color: var(--green);
      font-weight: 700;
      font-size: 14px;
    }

    .status {
      text-align: center;
      padding: 45px 15px;
      color: var(--muted);
      grid-column: 1 / -1;
    }

    footer {
      background: #102719;
      color: #e5eee7;
      padding: 28px 20px;
      text-align: center;
      font-size: 13px;
    }

    footer a { text-decoration: underline; }

    @media (max-width: 850px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
      .hero { padding: 42px 20px; }
      .nav { padding: 13px 16px; }
      .brand { font-size: 18px; }
      main { padding: 25px 16px 45px; }
    }
  </style>
</head>

<body>
  <header>
    <nav class="nav">
      <a class="brand" href="./" id="brand">BLOG SAYA</a>
      <a class="button" id="bloggerLink" href="#" target="_blank"
         rel="noopener">Kunjungi Blogger ↗</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <h1 id="heroTitle">Artikel dan Informasi Terbaru</h1>
      <p id="heroDescription">
        Temukan artikel, informasi, dan kabar terbaru di website kami.
      </p>
    </div>
  </section>

  <main>
    <div class="section-heading">
      <h2>Artikel Terbaru</h2>
    </div>

    <input
      id="search"
      class="search"
      type="search"
      placeholder="Cari artikel..."
      aria-label="Cari artikel"
    >

    <section id="posts" class="grid" aria-live="polite">
      <div class="status">Memuat artikel dari Blogger...</div>
    </section>
  </main>

  <footer>
    <p>© <span id="year"></span>
      <span id="footerName">Blog Saya</span>.
      Dikelola menggunakan Google Blogger.</p>
    <p><a id="footerLink" href="#" target="_blank" rel="noopener">
      Buka website Blogger
    </a></p>
  </footer>

  <script>
    // =========================================
    // PENGATURAN WEBSITE
    // GANTI URL DI BAWAH DENGAN URL BLOGGER ANDA
    // =========================================

    const CONFIG = {
      blogUrl: "https://griyapermaiasemjajar.blogspot.com/",
      siteName: "BLOG SAYA",
      title: "Artikel dan Informasi Terbaru",
      description:
        "Temukan artikel, informasi, dan kabar terbaru di website kami.",
      maxPosts: 12
    };

    const postsContainer = document.getElementById("posts");
    const searchInput = document.getElementById("search");
    let allPosts = [];

    document.title = CONFIG.siteName + " | Website Resmi";
    document.getElementById("brand").textContent = CONFIG.siteName;
    document.getElementById("heroTitle").textContent = CONFIG.title;
    document.getElementById("heroDescription").textContent =
      CONFIG.description;
    document.getElementById("footerName").textContent = CONFIG.siteName;
    document.getElementById("year").textContent =
      new Date().getFullYear();

    document.getElementById("bloggerLink").href = CONFIG.blogUrl;
    document.getElementById("footerLink").href = CONFIG.blogUrl;

    function getImage(entry) {
      if (entry.media$thumbnail?.url) {
        return entry.media$thumbnail.url.replace(
          /\/s\d+(-c)?\//, "/s800/"
        );
      }

      const html = entry.content?.$t || entry.summary?.$t || "";
      const match = html.match(/<img[^>]+src=["']([^"']+)/i);

      return match ? match[1] : "";
    }

    function getText(entry) {
      const html = entry.summary?.$t || entry.content?.$t || "";
      const doc = new DOMParser().parseFromString(html, "text/html");

      doc.querySelectorAll(
        "script,style,iframe,object,svg"
      ).forEach(el => el.remove());

      return (doc.body.textContent || "")
        .replace(/\s+/g, " ")
        .trim()
        .slice(0, 180);
    }

    function getLink(entry) {
      const link = (entry.link || []).find(
        item => item.rel === "alternate"
      );
      return link ? link.href : CONFIG.blogUrl;
    }

    function renderPosts(posts) {
      postsContainer.replaceChildren();

      if (!posts.length) {
        const message = document.createElement("div");
        message.className = "status";
        message.textContent = "Artikel tidak ditemukan.";
        postsContainer.appendChild(message);
        return;
      }

      posts.forEach(post => {
        const card = document.createElement("article");
        card.className = "post";

        const link = document.createElement("a");
        link.href = post.url;
        link.target = "_blank";
        link.rel = "noopener";
        link.setAttribute("aria-label", "Baca " + post.title);

        if (post.image) {
          const img = document.createElement("img");
          img.src = post.image;
          img.alt = post.title;
          img.loading = "lazy";
          img.onerror = () => img.remove();
          link.appendChild(img);
        }

        const body = document.createElement("div");
        body.className = "post-body";

        const title = document.createElement("h3");
        title.textContent = post.title;

        const summary = document.createElement("p");
        summary.textContent = post.summary || "Baca artikel selengkapnya.";

        const more = document.createElement("a");
        more.className = "read-more";
        more.href = post.url;
        more.target = "_blank";
        more.rel = "noopener";
        more.textContent = "Baca selengkapnya →";

        body.append(title, summary, more);
        card.append(link, body);
        postsContainer.appendChild(card);
      });
    }

    function loadPosts() {
      const callbackName =
        "bloggerCallback_" + Math.random().toString(36).slice(2);

      const script = document.createElement("script");
      const timeout = setTimeout(() => {
        cleanup();
        showError();
      }, 15000);

      function cleanup() {
        clearTimeout(timeout);
        delete window[callbackName];
        script.remove();
      }

      function showError() {
        postsContainer.replaceChildren();
        const message = document.createElement("div");
        message.className = "status";
        message.textContent =
          "Artikel gagal dimuat. Periksa URL Blogger, koneksi internet, " +
          "dan pastikan blog dapat diakses secara publik.";
        postsContainer.appendChild(message);
      }

      window[callbackName] = data => {
        cleanup();

        allPosts = (data.feed?.entry || []).map(entry => ({
          title: entry.title?.$t || "Tanpa judul",
          url: getLink(entry),
          image: getImage(entry),
          summary: getText(entry)
        }));

        renderPosts(allPosts);
      };

      script.onerror = () => {
        cleanup();
        showError();
      };

      const blogBase = CONFIG.blogUrl.replace(/\/+$/, "");
      const feedUrl = blogBase +
        "/feeds/posts/default?alt=json-in-script" +
        "&max-results=" + encodeURIComponent(CONFIG.maxPosts) +
        "&callback=" + encodeURIComponent(callbackName);

      script.src = feedUrl;
      document.head.appendChild(script);
    }

    searchInput.addEventListener("input", () => {
      const query = searchInput.value.toLowerCase().trim();

      renderPosts(allPosts.filter(post =>
        post.title.toLowerCase().includes(query) ||
        post.summary.toLowerCase().includes(query)
      ));
    });

    loadPosts();
  </script>
</body>
</html>
